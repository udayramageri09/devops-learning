apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: flash-sale-replicaset
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flash-sale
  template:
    metadata:
      labels:
        app: flash-sale
    spec:
      containers:
        - name: flash-sale
          image: flask-minikube:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 15000
          readinessProbe:
            httpGet:
              path: /health
              port: 15000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 15000
            initialDelaySeconds: 10
            periodSeconds: 10
